name: dotnet dev release

on:
  push:
    tags:
      - "v*.*.*-dev*"
  pull_request:
    paths:
      - ".github/workflows/dev-release.yml"
      - ".github/workflows/dotnet.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Set dev version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag=v0.0.0-dev0
          if [[ "$EVENT_NAME" == push ]]; then
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
            echo "Expected a dev tag such as v1.0.5-dev0." >&2
            exit 1
          fi
          echo "NET_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=Jellyfin.Plugin.Subdivx-${tag}.zip" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore
      - name: Test
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: dotnet test --configuration Release --no-restore --verbosity normal
      - name: Publish plugin
        run: |
          dotnet publish Jellyfin.Plugin.Subdivx/Jellyfin.Plugin.Subdivx.csproj \
            --configuration Release --no-restore --output release -p:Version="$NET_VERSION"
      - name: Package
        run: |
          for dll in Jellyfin.Plugin.Subdivx.dll SharpCompress.dll ZstdSharp.dll; do
            test -s "release/$dll"
          done
          zip -j "$ZIP_NAME" release/Jellyfin.Plugin.Subdivx.dll release/SharpCompress.dll release/ZstdSharp.dll
          unzip -t "$ZIP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: subdivx-dev-zip
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subdivx-dev-zip
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "Jellyfin.Plugin.Subdivx-${TAG}.zip" \
            --verify-tag --prerelease --latest=false --title "$TAG" \
            --notes "Development build for manual testing."
